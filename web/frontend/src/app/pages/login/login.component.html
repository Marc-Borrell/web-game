<div class="main-content container-fluid d-flex flex-column align-items-center justify-content-center text-center vh-100 py-4 px-2 px-md-4 bg-custom">
    <div class="row align-items-center justify-content-center w-100 h-100">
        
        <div class="login col-md-8 col-lg-4 col-8 pt-5 pb-5">
            <form #f="ngForm" (ngSubmit)="onSubmit()">
                <h2>Iniciar sessió</h2>
            <label class="mt-3 text-start">
                Email:
                <input type="email" name="email" class="form-control" [(ngModel)]="email" placeholder="Introdueix el teu correu" required>
            </label><br>
            <label class="mt-3 text-start">
                Contrasenya:
                <input type="password" name="password" class="form-control" [(ngModel)]="password" placeholder="Introdueix la teva contrasenya" required>
            </label> 

            <div *ngIf="error" class="error-msg">{{ error }}</div>
            <br><br>
                <button type="submit" class="btn btn-action mb-4" [disabled]="loading" >
                {{ loading ? 'Carregant...' : 'Iniciar sessió' }}
                </button>
            </form>

            <!-- <button type="button" (click)="loginWithGoogle()">
            Iniciar sessió amb Google
            </button> -->
        
            <p><a href="/register">Si encara no estàs registrat fes-ho ara!</a></p>
            <p><a href="/start"> Torna a l'inici</a></p>

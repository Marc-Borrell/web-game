<div
  class="main-content container-fluid d-flex flex-column align-items-center justify-content-center text-center vh-100 py-4 px-2 px-md-4 bg-custom">
  <div class="row align-items-center justify-content-center w-100 h-100">

    <div class="register col-md-8 col-lg-4 col-8 pt-5 pb-5">
      <form #f="ngForm" (ngSubmit)="onSubmit()">
        <h2>registra't!</h2>
        <label class="mt-3 text-start">
          Usuari:
          <input type="text" name="name" class="form-control" [(ngModel)]="name" placeholder="Introdueix el teu usuari"
            required>
        </label>
        <label class="mt-3 text-start">
          Correu:
          <input type="email" name="email" class="form-control" [(ngModel)]="email"
            placeholder="Introdueix el teu correu" required>
        </label>
        <label class="mt-3 text-start">
          Contrasenya:
          <input type="password" name="password" class="form-control" [(ngModel)]="password"
            placeholder="Introdueix la teva contrasenya" required>
        </label>
        <label class="mt-3 text-start">
          Torna a introduir la contrasenya:
          <input type="password" name="passwordVerify" class="form-control mb-4" [(ngModel)]="passwordVerify"
            placeholder="Introdueix la teva contrasenya de nou" required>
        </label>
        @if (error) {
        <div class="error-msg">{{ error }}</div>
        }
        <br>
        <button type="submit" class="btn btn-action mb-4" [disabled]="loading">{{ loading ? 'Carregant...' :
          'Registrar-se' }}</button>
      </form>

      <a href="/login">Ja tens compte? Inicia sessió</a>

    </div>

  </div>
</div>

<div class="container-fluid">
    <div class="row justify-content-evenly  align-items-center vh-100 ">
        <div class="col-4 align-self-center ">
            <div class="nomComplet">
                <div class="logo">M . <span class="glitch-o">O</span> . N</div>
                <div class="protocol">PROTOCOL</div>
            </div>
            <div class="row justify-content-md-center middleContent d-flex flex-column align-items-center">
                <div class="col-auto"></div>
                <div class="col-8">
                    <div class="alt3D-container">
                        <div>
                            <div class="image-card justify-content-md-center middleContent d-flex flex-column align-items-center"
                                #imageCard (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()"
                                [style.transform]="cardTransform" [style.--mouse-x.px]="mouseX"
                                [style.--mouse-y.px]="mouseY">
                                <img src="bunny-img.png" alt="Cromo">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-auto"></div>
            </div>
            <div class="col align-self-center">

                <p>Per accedir a aquesta web es necessari utilitzar una compte per
                    l'aplicació</p>
                <div class="dropdown">

                    <button class="btn btn-prueba dropdown-toggle" type="button" id="dropdownMenuButton"
                        data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Comença ara!
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="/register">Registra't</a>
                        <a class="dropdown-item" href="/login">Inicia sessió</a>
                    </div>
                </div>

            </div>
        </div>

        <div class="col-8">
            <div class="row justify-content-md-center">
                <div class="col-auto"></div>

                <div class="col-md-8 col-12 col-sm-10 d-flex justify-content-md-center middleContent">
                    <div id="carouselExampleCaptions" class="carousel slide">
                        <div class="carousel-indicators">
                            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0"
                                class="active" aria-current="true" aria-label="Slide 1"></button>
                            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                                aria-label="Slide 2"></button>

                        </div>
                        <div class="carousel-inner">
                            <div class="carousel-item active rounded">
                                <img src="carrousel1.webp" class="d-block w-100" alt="proba2">
                                <div class="carousel-caption d-none d-md-block">
                                    <h5>Puntua!</h5>
                                    <p>Guanya punts insertant les caixes al seu desti i classifica al ranking.</p>
                                </div>
                            </div>
                            <div class="carousel-item">
                                <img src="carrousel2.webp" class="d-block w-100" alt="proba1">
                                <div class="carousel-caption d-none d-md-block">
                                    <h5>Sigues ràpid!</h5>
                                    <p>La teva puntuació depen de quant ràpid col·loquis la caixa al seu destí.</p>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
